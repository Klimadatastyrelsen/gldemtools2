name: Test

on: [push, pull_request]

jobs:
  test:
    name: "Test"
    runs-on: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v6
    - uses: prefix-dev/setup-pixi@v0.9.4
      with:
        pixi-version: v0.65.0
        cache: true
        auth-host: prefix.dev
        auth-token: ${{ secrets.PREFIX_DEV_TOKEN }}
    - run: pixi run test
