name: Typecheck

on: [push, pull_request]

jobs:
  typecheck:
    name: "Type check with mypy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.65.0
          cache: true
      - run: pixi run typecheck
